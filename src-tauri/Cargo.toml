# ملف إعداد Tauri (Rust) لمشروع B-Shop — غلاف تطبيق سطح المكتب.
# الواجهة بتشتغل من نسخة Nuxt المولّدة ستاتيكيًا (.output/public) زي ما محدد في tauri.conf.json.

[package]
name = "b-shop"
version = "1.0.0"
description = "B-Shop ERP — Integrated POS, Billing & Inventory System"
authors = ["B-Shop Team"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
